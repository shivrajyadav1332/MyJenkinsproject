<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Cloud Storage</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        header {
            background: #4a90e2;
            color: #fff;
            padding: 14px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { font-size: 20px; }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 18px;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        nav a:hover { background: rgba(255,255,255,0.2); }
        .content {
            max-width: 800px;
            margin: 36px auto;
            padding: 0 16px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 28px;
            margin-bottom: 24px;
        }
        .card h2 { color: #333; margin-bottom: 18px; font-size: 17px; }
        .welcome { font-size: 22px; color: #4a90e2; margin-bottom: 8px; font-weight: bold; }
        .sub { color: #666; font-size: 14px; }
        .upload-form {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        input[type="file"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            padding: 9px 20px;
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #357abd; }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }
        .info-item {
            background: #f7f9fc;
            border-radius: 6px;
            padding: 16px;
            text-align: center;
        }
        .info-item .label { font-size: 12px; color: #888; margin-bottom: 6px; }
        .info-item .value { font-size: 16px; font-weight: bold; color: #333; }
        .action-links a {
            display: inline-block;
            margin-right: 14px;
            color: #4a90e2;
            text-decoration: none;
            font-size: 14px;
        }
        .action-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <h1>☁️ Cloud Storage</h1>
        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/profile">My Profile</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <div class="content">
        <div class="card">
            <div class="welcome">Welcome, {{ user }}! 👋</div>
            <div class="sub">Manage your files and account from your personal dashboard.</div>
        </div>

        <div class="card">
            <h2>📤 Upload File to S3</h2>
            <form action="/upload" method="POST" enctype="multipart/form-data">
                <div class="upload-form">
                    <input type="file" name="file" required>
                    <button type="submit">Upload</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>🔗 Quick Links</h2>
            <div class="action-links">
                <a href="/profile">✏️ Edit Profile</a>
                <a href="/logout">🚪 Logout</a>
            </div>
        </div>
    </div>
</body>
</html>
