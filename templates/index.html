<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Storage - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #333;
        }
        .tabs {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 2px solid #e0e0e0;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            color: #888;
            font-weight: bold;
            text-decoration: none;
        }
        .tab.active {
            color: #4a90e2;
            border-bottom: 2px solid #4a90e2;
            margin-bottom: -2px;
        }
        form { display: flex; flex-direction: column; gap: 14px; }
        input[type="text"], input[type="password"] {
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            width: 100%;
        }
        input:focus { outline: none; border-color: #4a90e2; }
        button {
            padding: 11px;
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #357abd; }
        .message {
            text-align: center;
            margin-top: 12px;
            color: #e74c3c;
            font-size: 14px;
        }
        .section { display: none; }
        .section.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h2>☁️ Cloud Storage</h2>
        <div class="tabs">
            <a class="tab active" href="#" onclick="showSection('login', this)">Login</a>
            <a class="tab" href="#" onclick="showSection('register', this)">Register</a>
        </div>

        <div id="login" class="section active">
            <form action="/login" method="POST">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>

        <div id="register" class="section">
            <form action="/register" method="POST">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="email" name="email" placeholder="Email (optional)">
                <button type="submit">Register</button>
            </form>
        </div>
    </div>

    <script>
        function showSection(id, tab) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            tab.classList.add('active');
            return false;
        }
    </script>
</body>
</html>
