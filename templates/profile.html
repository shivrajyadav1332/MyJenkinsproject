<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Cloud Storage</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        header {
            background: #4a90e2;
            color: #fff;
            padding: 14px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { font-size: 20px; }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 18px;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        nav a:hover { background: rgba(255,255,255,0.2); }
        .content {
            max-width: 600px;
            margin: 36px auto;
            padding: 0 16px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 28px;
            margin-bottom: 24px;
        }
        .card h2 { color: #333; margin-bottom: 20px; font-size: 18px; }
        .avatar {
            width: 70px;
            height: 70px;
            background: #4a90e2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
            margin-bottom: 14px;
        }
        .profile-name { font-size: 22px; font-weight: bold; color: #333; }
        .profile-email { color: #888; font-size: 14px; margin-top: 4px; }
        form { display: flex; flex-direction: column; gap: 16px; }
        label { font-size: 13px; color: #555; font-weight: bold; margin-bottom: 4px; display: block; }
        input[type="text"], input[type="password"], input[type="email"] {
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            width: 100%;
        }
        input:focus { outline: none; border-color: #4a90e2; }
        input[readonly] { background: #f5f5f5; color: #888; cursor: not-allowed; }
        .btn-primary {
            padding: 11px;
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary:hover { background: #357abd; }
        .alert {
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .alert-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .alert-error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .section-divider {
            border: none;
            border-top: 1px solid #eee;
            margin: 8px 0 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>☁️ Cloud Storage</h1>
        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/profile">My Profile</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <div class="content">
        {% if message %}
        <div class="alert {% if error %}alert-error{% else %}alert-success{% endif %}">
            {{ message }}
        </div>
        {% endif %}

        <div class="card">
            <div class="avatar">{{ user[0]|upper }}</div>
            <div class="profile-name">{{ user }}</div>
            <div class="profile-email">{{ email if email else "No email set" }}</div>
        </div>

        <div class="card">
            <h2>✏️ Update Profile</h2>
            <form action="/update_profile" method="POST">
                <div>
                    <label for="username">Username</label>
                    <input type="text" id="username" value="{{ user }}" readonly>
                </div>
                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" value="{{ email if email else '' }}" placeholder="Enter your email">
                </div>
                <button type="submit" class="btn-primary">Save Changes</button>
            </form>
        </div>

        <div class="card">
            <h2>🔒 Change Password</h2>
            <form action="/change_password" method="POST">
                <div>
                    <label for="current_password">Current Password</label>
                    <input type="password" id="current_password" name="current_password" placeholder="Enter current password" required>
                </div>
                <div>
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required>
                </div>
                <div>
                    <label for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
                </div>
                <button type="submit" class="btn-primary">Change Password</button>
            </form>
        </div>
    </div>
</body>
</html>
